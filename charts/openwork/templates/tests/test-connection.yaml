apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "openwork.fullname" . }}-test-connection"
  labels:
    {{- include "openwork.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['--spider', '--timeout=5', 'http://{{ include "openwork.fullname" . }}-http:8787/health']
  restartPolicy: Never
